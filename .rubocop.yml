# Merge our Exclude entries with RuboCop's defaults (vendor/, .git/, ...)
# instead of replacing them; CI installs gems into vendor/bundle.
inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "examples/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - "**/*_spec.rb"
    - "**/*.gemspec"

Metrics/MethodLength:
  Max: 15

Metrics/AbcSize:
  Max: 20
  Exclude:
    - "**/*_spec.rb"

Metrics/ClassLength:
  Max: 150

Metrics/ParameterLists:
  CountKeywordArgs: false

Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true

# AccessContext's set_token / set_bulk_tokens / set_resource_error / set_error
# names are the cross-SDK contract (keycard-sdk-spec access-context.md).
Naming/AccessorMethodName:
  Exclude:
    - "oauth/lib/keycardai/oauth/access_context.rb"
